<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calepinage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5f8c">
<title>Calepinage</title>
<link rel="apple-touch-icon" id="ic">
<link rel="manifest" id="mf">
<style>
:root{--bg:#eceff2;--card:#fff;--tx:#16202a;--mu:#5d6b78;--ac:#0f5f8c;--bd:#cfd6dd;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#19222b;--tx:#e8edf1;--mu:#92a0ad;--ac:#4aa8dc;--bd:#2c3945;--bad:#f2867f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;
padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:1.35rem;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:18px 0 8px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:.75rem;color:var(--mu);min-width:64px;flex:1}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label.ck{flex-direction:row;align-items:center;gap:6px;flex:0 0 auto;font-size:.9rem;color:var(--tx);min-height:44px}
label.ck input{width:22px;min-height:22px;padding:0}
button{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.x{color:var(--bad);flex:0 0 44px;padding:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:transparent;color:var(--mu)}
nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
nav button.go{background:var(--ac);color:#fff}
.mu{color:var(--mu)}.bad{color:var(--bad);font-weight:600}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.st b{display:block;font-size:1.3rem}
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:8px}
.p-g{cursor:pointer}.p-g.sel rect.b{stroke:var(--ac);stroke-width:var(--sw3)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--bd)}
.plan{break-inside:avoid;margin-bottom:16px}
@media print{
 body{padding:0;background:#fff;color:#000}nav,h1,.bar,.noprint,.tab:not(#t3){display:none!important}
 #t3{display:block!important}main{max-width:none;padding:0}
 .card,.st div,svg{border-color:#999;background:#fff;color:#000}.mu{color:#333}
}
</style>
</head>
<body>
<main>
<h1>Calepinage · scie à format</h1>

<section class="tab on" id="t1">
 <div class="card"><div class="r">
  <label>Trait de scie (mm)<input type="number" inputmode="decimal" data-g="kerf" id="kerf"></label>
  <label>Marge d’affranchissage (mm)<input type="number" inputmode="decimal" data-g="margin" id="margin"></label>
 </div></div>
 <h2>Panneaux et chutes en stock</h2>
 <div id="lsS" data-list="sheets"></div>
 <div class="bar"><button class="p" data-add="sheets">+ Panneau</button><button data-add="chute">+ Chute</button></div>
 <h2>Projet</h2>
 <div class="bar"><button data-act="jsonx">Exporter (JSON)</button><button data-act="jsoni">Importer (JSON)</button></div>
</section>

<section class="tab" id="t2">
 <h2>Liste de débit</h2>
 <div id="lsP" data-list="pieces"></div>
 <div class="bar"><button class="p" data-add="pieces">+ Pièce</button><button data-act="csvx">Exporter (CSV)</button><button data-act="csvi">Importer (CSV)</button></div>
 <p class="mu">Format CSV : nom;longueur;largeur;quantité;rotation (0/1);épaisseur;chant. La longueur suit le fil du bois.</p>
</section>

<section class="tab" id="t3">
 <div class="bar noprint"><button class="p" data-act="print">Imprimer / PDF</button><button data-act="calc">Recalculer</button></div>
 <div id="res"></div>
</section>
<input type="file" id="file" hidden>
</main>

<nav>
 <button data-tab="t1" class="on">Panneaux</button>
 <button data-tab="t2">Pièces</button>
 <button class="go" data-act="calc">Calculer</button>
 <button data-tab="t3">Plans</button>
</nav>

<script>
"use strict";
const $=s=>document.querySelector(s), KEY="calepinage.v1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- État et sauvegarde locale ---------- */
const defSheet=()=>({n:"Mélaminé blanc",L:2800,W:2070,t:19,q:5,g:0,c:0});
const defPiece=()=>({n:"",L:600,W:400,q:1,r:0,t:19,e:""});
function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.sheets&&d.pieces)return d}catch(e){}
 return {kerf:3,margin:10,sheets:[defSheet()],pieces:[
  {n:"Côté",L:720,W:560,q:2,r:0,t:19,e:"L1"},{n:"Dessus",L:800,W:560,q:1,r:0,t:19,e:""},
  {n:"Étagère",L:764,W:540,q:3,r:1,t:19,e:"L1"},{n:"Fond",L:700,W:760,q:1,r:1,t:19,e:""}],res:null};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Moteur de calepinage (guillotine garanti) ----------
 Chaque pièce est posée dans le coin d’un rectangle libre, puis ce rectangle est
 coupé par UNE coupe traversante (horizontale ou verticale) en deux sous-rectangles
 indépendants (+ trait de scie). Il n’existe donc que des coupes de part en part. */
const SORTS=[
 (a,b)=>b.w*b.h-a.w*a.h,
 (a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h),
 (a,b)=>b.w-a.w||b.h-a.h,
 (a,b)=>b.h-a.h||b.w-a.w];
const rots=(it,s)=>(!s.g||it.r)?[0,1]:[0];   // fil imposé : pas de rotation

function pack(items,pool,so,sp,k,m){
 const rem=pool.map(s=>s.rem),bins=[],un=[];let cuts=0;
 items=items.slice().sort(SORTS[so]);
 for(let q=0;q<items.length;q++){
  const it=items[q];let b=null,fi=-1,ro=0,bs=Infinity;
  for(const x of bins)x.free.forEach((f,i)=>{
   for(const r of rots(it,x.s)){
    const w=r?it.h:it.w,h=r?it.w:it.h;
    if(w<=f.w&&h<=f.h){
     const sc=Math.min(f.w-w,f.h-h)*1e4+Math.max(f.w-w,f.h-h);
     if(sc<bs){bs=sc;b=x;fi=i;ro=r}
    }}});
  if(!b){ // ouvrir un nouveau panneau : chutes d’abord, puis le plus petit qui convient
   let c=-1;
   pool.forEach((s,i)=>{
    if(rem[i]<1)return;
    const ok=rots(it,s).some(r=>(r?it.h:it.w)<=s.L-2*m&&(r?it.w:it.h)<=s.W-2*m);
    if(ok&&(c<0||s.c>pool[c].c||(s.c==pool[c].c&&s.L*s.W<pool[c].L*pool[c].W)))c=i;
   });
   if(c<0){un.push(it);continue}
   rem[c]--;
   bins.push({s:pool[c],idx:c,free:[{x:m,y:m,w:pool[c].L-2*m,h:pool[c].W-2*m}],pl:[]});
   q--;continue;
  }
  const f=b.free[fi],w=ro?it.h:it.w,h=ro?it.w:it.h,lw=f.w-w,lh=f.h-h;
  b.pl.push({id:it.id,n:it.n,e:it.e,x:f.x,y:f.y,w,h,ro});
  b.free.splice(fi,1);
  const rw=lw-k,bh=lh-k,hz=sp?lw>lh:lw<=lh;
  if(hz){ // coupe horizontale pleine largeur, puis coupe verticale sur la bande
   if(rw>0)b.free.push({x:f.x+w+k,y:f.y,w:rw,h});
   if(bh>0)b.free.push({x:f.x,y:f.y+h+k,w:f.w,h:bh});
   cuts+=(lh>0?f.w:0)+(lw>0?h:0);
  }else{ // coupe verticale pleine hauteur, puis coupe horizontale dans la colonne
   if(rw>0)b.free.push({x:f.x+w+k,y:f.y,w:rw,h:f.h});
   if(bh>0)b.free.push({x:f.x,y:f.y+h+k,w,h:bh});
   cuts+=(lw>0?f.h:0)+(lh>0?w:0);
  }
 }
 const area=bins.reduce((a,b)=>a+b.s.L*b.s.W,0);
 return {bins,un,cuts,area};
}
const cmp=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};

function solve(){
 const k=S.kerf,m=S.margin,groups={};
 const stock=S.sheets.filter(s=>s.L>0&&s.W>0&&s.q>0).map(s=>({...s,rem:s.q}));
 S.pieces.forEach((p,pi)=>{
  if(!(p.L>0&&p.W>0&&p.q>0))return;
  for(let j=0;j<p.q;j++)(groups[p.t||0]=groups[p.t||0]||[]).push({id:pi,n:p.n||("P"+(pi+1)),w:p.L,h:p.W,r:p.r,e:p.e});
 });
 const out={bins:[],un:[],cuts:0,pa:0};
 for(const t of Object.keys(groups)){
  const pool=stock.filter(s=>!+t||s.t==+t);
  let best=null,bsc=null;
  for(let so=0;so<4;so++)for(let sp=0;sp<2;sp++){
   const r=pack(groups[t],pool,so,sp,k,m),sc=[r.un.length,r.area,r.bins.length,r.cuts];
   if(!best||cmp(sc,bsc)<0){best=r;bsc=sc}
  }
  best.bins.forEach(b=>pool[b.idx].rem--);
  out.bins.push(...best.bins.map(b=>({s:{n:b.s.n,L:b.s.L,W:b.s.W,t:b.s.t,g:b.s.g,c:b.s.c},pl:b.pl,free:b.free})));
  out.un.push(...best.un);out.cuts+=best.cuts;
 }
 out.pa=out.bins.reduce((a,b)=>a+b.pl.reduce((x,p)=>x+p.w*p.h,0),0);
 out.sa=out.bins.reduce((a,b)=>a+b.s.L*b.s.W,0);
 return out;
}

/* ---------- Formulaires ---------- */
const fld=(l,k,v,type,fx)=>`<label style="flex:${fx||1}">${l}<input data-k="${k}" type="${type||"number"}" value="${esc(v)}" ${(type||"number")=="number"?'inputmode="decimal" min="0"':""}></label>`;
const ck=(l,k,v)=>`<label class="ck"><input type="checkbox" data-k="${k}" ${v?"checked":""}>${l}</label>`;
const del=i=>`<button class="x" data-del="${i}" aria-label="Supprimer">✕</button>`;
function draw(){
 $("#kerf").value=S.kerf;$("#margin").value=S.margin;
 $("#lsS").innerHTML=S.sheets.map((o,i)=>`<div class="card" data-i="${i}"><div class="r">${
  fld("Nom","n",o.n,"text",3)+fld("Long.","L",o.L)+fld("Larg.","W",o.W)+fld("Ép.","t",o.t)+fld("Qté","q",o.q)+
  ck("Fil dans la longueur","g",o.g)+ck("Chute","c",o.c)+del(i)}</div></div>`).join("")||'<p class="mu">Ajoutez un panneau pour commencer.</p>';
 $("#lsP").innerHTML=S.pieces.map((o,i)=>`<div class="card" data-i="${i}"><div class="r">${
  fld("Référence","n",o.n,"text",3)+fld("Long. (fil)","L",o.L)+fld("Larg.","W",o.W)+fld("Qté","q",o.q)+fld("Ép.","t",o.t)+
  fld("Chant","e",o.e,"text")+ck("Rotation ok","r",o.r)+del(i)}</div></div>`).join("")||'<p class="mu">Ajoutez les pièces à débiter.</p>';
 showRes();
}

/* ---------- Plans de coupe (SVG) ---------- */
const hue=id=>(id*47+200)%360;
function svgBin(b,bi){
 const L=b.s.L,W=b.s.W,u=Math.max(L,W)/700,fs0=Math.max(L,W)/45;
 let g=`<svg viewBox="0 0 ${L} ${W}" style="--sw3:${u*3}px" role="img" aria-label="Plan du panneau ${bi+1}">`+
  `<defs><pattern id="gr${bi}" width="10" height="${u*9}" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-opacity=".18" stroke-width="${u}"/></pattern></defs>`+
  `<rect x="0" y="0" width="${L}" height="${W}" fill="none" stroke="currentColor" stroke-width="${u*2}"/>`+
  `<rect x="${S.margin}" y="${S.margin}" width="${L-2*S.margin}" height="${W-2*S.margin}" fill="none" stroke="#888" stroke-dasharray="${u*6} ${u*6}" stroke-width="${u}"/>`;
 b.free.forEach(f=>{if(f.w>=50&&f.h>=50)g+=`<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="#888" fill-opacity=".1" stroke="#888" stroke-dasharray="${u*3} ${u*3}" stroke-width="${u}"/>`});
 b.pl.forEach((p,j)=>{
  const dims=`${p.w}×${p.h}`,fs=Math.min(p.h/4,p.w/(dims.length*.62),fs0);
  g+=`<g class="p-g" data-b="${bi}" data-j="${j}"><rect class="b" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="hsl(${hue(p.id)} 60% 78%)" stroke="#334" stroke-width="${u}"/>`+
   (b.s.g?`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="url(#gr${bi})" pointer-events="none"/>`:"");
  if(fs>=Math.max(L,W)/160)g+=`<text x="${p.x+p.w/2}" y="${p.y+p.h/2-fs*.1}" text-anchor="middle" font-size="${fs}" fill="#16202a" font-weight="600" pointer-events="none">${esc(p.n)}${p.ro?" ↻":""}</text>`+
   `<text x="${p.x+p.w/2}" y="${p.y+p.h/2+fs*1.1}" text-anchor="middle" font-size="${fs*.9}" fill="#16202a" pointer-events="none">${dims}</text>`;
  g+=`</g>`;
 });
 return g+"</svg>";
}
const pct=x=>(x*100).toFixed(1).replace(".",",")+" %";
function showRes(){
 const R=S.res,el=$("#res");
 if(!R){el.innerHTML='<p class="mu">Aucun plan pour l’instant. Appuyez sur « Calculer ».</p>';return}
 const tot={};S.pieces.forEach(p=>{if(p.L>0&&p.W>0&&p.q>0)tot[p.n]=0});
 let h=`<div class="st"><div>Panneaux utilisés<b>${R.bins.length}</b></div><div>Taux de chute<b>${R.sa?pct(1-R.pa/R.sa):"–"}</b></div>`+
  `<div>Linéaire de coupe<b>${(R.cuts/1000).toFixed(1).replace(".",",")} m</b></div><div>Trait de scie<b>${S.kerf} mm</b></div></div>`;
 if(R.un.length)h+=`<p class="bad">${R.un.length} pièce(s) non placée(s) : ${esc([...new Set(R.un.map(p=>p.n+" "+p.w+"×"+p.h))].join(", "))}. Ajoutez du stock ou vérifiez épaisseur et dimensions.</p>`;
 h+=`<h2>Feuille de débit</h2><div class="card"><table><tr><th>Réf.</th><th>Long.</th><th>Larg.</th><th>Qté</th><th>Ép.</th><th>Fil</th><th>Chant</th></tr>`+
  S.pieces.filter(p=>p.L>0&&p.W>0&&p.q>0).map(p=>`<tr><td>${esc(p.n)}</td><td>${p.L}</td><td>${p.W}</td><td>${p.q}</td><td>${p.t||"–"}</td><td>${p.r?"libre":"imposé"}</td><td>${esc(p.e)}</td></tr>`).join("")+`</table></div>`;
 R.bins.forEach((b,i)=>{
  const used=b.pl.reduce((a,p)=>a+p.w*p.h,0),fr=b.free.filter(f=>f.w>=150&&f.h>=150).sort((a,c)=>c.w*c.h-a.w*a.h).slice(0,4);
  h+=`<div class="plan"><h2>Panneau ${i+1} · ${esc(b.s.n)} ${b.s.L}×${b.s.W}${b.s.t?"×"+b.s.t:""}${b.s.c?" (chute)":""} · ${pct(used/(b.s.L*b.s.W))} utilisé</h2>${svgBin(b,i)}`+
   `<p class="mu">${b.pl.length} pièces${b.s.g?" · fil dans la longueur (hachures)":""}${fr.length?" · chutes réutilisables : "+fr.map(f=>f.w+"×"+f.h).join(", "):""}</p></div>`;
 });
 h+=`<p id="info" class="mu noprint">Touchez une pièce pour voir ses détails.</p>`;
 el.innerHTML=h;
}

/* ---------- Actions ---------- */
function download(name,text,type){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();
}
function tab(id){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.id==id));
 document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab==id));
 window.scrollTo(0,0);
}
let mode="";
function importText(txt){
 try{
  if(mode=="json"){const d=JSON.parse(txt);if(!d.sheets||!d.pieces)throw 0;S=d;}
  else{
   const rows=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(l.includes(";")?";":","));
   if(rows.length&&isNaN(parseFloat(rows[0][1])))rows.shift();
   S.pieces=rows.map(c=>({n:c[0]||"",L:parseFloat(c[1])||0,W:parseFloat(c[2])||0,q:parseInt(c[3])||1,r:+(c[4]=="1"),t:parseFloat(c[5])||0,e:c[6]||""}));
  }
  S.res=null;save();draw();
 }catch(e){alert("Fichier illisible : vérifiez son format.")}
}
document.addEventListener("input",e=>{
 const t=e.target,g=t.dataset.g,k=t.dataset.k;
 const v=t.type=="checkbox"?+t.checked:t.type=="number"?(parseFloat(t.value)||0):t.value;
 if(g)S[g]=v;
 else if(k)S[t.closest("[data-list]").dataset.list][t.closest("[data-i]").dataset.i][k]=v;
 else return;
 if(S.res){S.res=null;showRes()}
 save();
});
document.addEventListener("click",e=>{
 const t=e.target.closest("button,.p-g");if(!t)return;
 const d=t.dataset;
 if(d.tab)return tab(d.tab);
 if(d.add){
  if(d.add=="pieces")S.pieces.push(defPiece());
  else S.sheets.push(d.add=="chute"?{n:"Chute",L:1000,W:600,t:19,q:1,g:0,c:1}:defSheet());
  S.res=null;save();draw();return;
 }
 if(d.del!==undefined){S[t.closest("[data-list]").dataset.list].splice(+d.del,1);S.res=null;save();draw();return}
 if(d.act=="calc"){
  if(!S.sheets.some(s=>s.q>0)||!S.pieces.length){alert("Ajoutez au moins un panneau et une pièce.");return}
  S.res=solve();save();showRes();tab("t3");return;
 }
 if(d.act=="print"){if(!S.res)return alert("Calculez d’abord les plans.");window.print();return}
 if(d.act=="jsonx")return download("calepinage.json",JSON.stringify({...S,res:null}),"application/json");
 if(d.act=="csvx")return download("pieces.csv","nom;longueur;largeur;quantite;rotation;epaisseur;chant\n"+S.pieces.map(p=>[p.n,p.L,p.W,p.q,p.r,p.t,p.e].join(";")).join("\n"),"text/csv");
 if(d.act=="jsoni"||d.act=="csvi"){mode=d.act=="jsoni"?"json":"csv";$("#file").value="";$("#file").accept=mode=="json"?".json":".csv,.txt";$("#file").click();return}
 if(t.classList.contains("p-g")){
  document.querySelectorAll(".p-g.sel").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");
  const p=S.res.bins[+d.b].pl[+d.j];
  $("#info").textContent=`${p.n} : ${p.w}×${p.h} mm en (${Math.round(p.x)} ; ${Math.round(p.y)})${p.ro?" · pivotée de 90°":""}${p.e?" · chant "+p.e:""}`;
 }
});
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(importText)});

/* ---------- PWA : icône, manifeste, hors-ligne ---------- */
(()=>{
 const icon=s=>{const c=document.createElement("canvas");c.width=c.height=s;const x=c.getContext("2d"),u=s/180;
